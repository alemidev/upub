name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install trunk
      - uses: actions/checkout@v4
      - run: trunk build --release
        working-directory: web/
      - run: cargo build --features=web
      - run: cargo test --features=web

  build:
    needs: [test]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: linux-x64-gnu
            ext:
          - runner: windows-latest
            target: win32-x64
            ext: .exe
          - runner: macos-14
            target: darwin-arm64
            ext:
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install trunk
      - uses: actions/checkout@v4
      - run: trunk build --release
        working-directory: web/
      - run: cargo build --release --features=web,openssl-vendored
      - run: mv target/release/upub${{ matrix.platform.ext }} upub-${{ github.ref_name }}-${{ matrix.platform.target }}${{ matrix.platform.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: upub-${{ github.ref_name }}-${{ matrix.platform.target }}
          path: upub-${{ github.ref_name }}-${{ matrix.platform.target }}${{ matrix.platform.ext }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: '**'
          generate_release_notes: true
          make_latest: true
